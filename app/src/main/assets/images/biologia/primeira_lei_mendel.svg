<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <text x="400" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    A Primeira Lei de Mendel: Segregação dos Fatores (Monoibridismo)
  </text>
  <text x="400" y="50" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Separação dos alelos homólogos na meiose e a proporção fenotípica clássica 3:1
  </text>

  <!-- Left: P and F1 Generations -->
  <g transform="translate(40, 75)">
    <rect width="320" height="240" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="160" y="24" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      CRUZAMENTO PARENTAL (GERAÇÃO P)
    </text>

    <!-- Parent 1: Pure Yellow (VV) -->
    <g transform="translate(30, 45)">
      <circle cx="30" cy="30" r="22" fill="#EAB308" stroke="#FDE047" stroke-width="2"/>
      <text x="30" y="35" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">VV</text>
      <text x="30" y="68" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Amarela Pura</text>
    </g>

    <text x="125" y="80" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">×</text>

    <!-- Parent 2: Pure Green (vv) -->
    <g transform="translate(160, 45)">
      <circle cx="30" cy="30" r="22" fill="#15803D" stroke="#4ADE80" stroke-width="2"/>
      <text x="30" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">vv</text>
      <text x="30" y="68" fill="#86EFAC" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Verde Pura</text>
    </g>

    <line x1="30" y1="130" x2="290" y2="130" stroke="#334155" stroke-width="1"/>

    <!-- Geração F1 -->
    <text x="160" y="150" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      PRIMEIRA GERAÇÃO FILIAL (F1)
    </text>
    <g transform="translate(110, 160)">
      <circle cx="50" cy="25" r="20" fill="#EAB308" stroke="#FDE047" stroke-width="2"/>
      <text x="50" y="30" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Vv</text>
      <text x="50" y="58" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">100% Amarelas Heterozigotas</text>
    </g>
  </g>

  <!-- Right: Punnett Square F2 -->
  <g transform="translate(390, 75)">
    <rect width="370" height="240" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="185" y="24" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      AUTOFECUNDAÇÃO F1 (Vv × Vv) → GERAÇÃO F2
    </text>

    <!-- Punnett Square Grid -->
    <g transform="translate(50, 45)">
      <!-- Headers -->
      <text x="65" y="15" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Gameta V</text>
      <text x="160" y="15" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Gameta v</text>
      <text x="5" y="55" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">V</text>
      <text x="5" y="115" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">v</text>

      <!-- Cells -->
      <!-- Top-Left: VV (Yellow) -->
      <rect x="35" y="25" width="95" height="55" rx="4" fill="#EAB308" stroke="#CA8A04"/>
      <text x="82" y="50" fill="#000000" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">VV</text>
      <text x="82" y="68" fill="#713F12" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Amarela (25%)</text>

      <!-- Top-Right: Vv (Yellow) -->
      <rect x="135" y="25" width="95" height="55" rx="4" fill="#EAB308" stroke="#CA8A04"/>
      <text x="182" y="50" fill="#000000" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Vv</text>
      <text x="182" y="68" fill="#713F12" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Amarela (25%)</text>

      <!-- Bottom-Left: Vv (Yellow) -->
      <rect x="35" y="85" width="95" height="55" rx="4" fill="#EAB308" stroke="#CA8A04"/>
      <text x="82" y="110" fill="#000000" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Vv</text>
      <text x="82" y="128" fill="#713F12" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Amarela (25%)</text>

      <!-- Bottom-Right: vv (Green) -->
      <rect x="135" y="85" width="95" height="55" rx="4" fill="#15803D" stroke="#16A34A"/>
      <text x="182" y="110" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">vv</text>
      <text x="182" y="128" fill="#BBF7D0" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Verde (25%)</text>
    </g>

    <!-- Proportions -->
    <g transform="translate(20, 195)">
      <text x="0" y="15" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
        • <tspan fill="#FBBF24" font-weight="bold">Proporção Fenotípica:</tspan> 3 Amarelas (75%) : 1 Verde (25%)
      </text>
      <text x="0" y="32" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
        • <tspan fill="#34D399" font-weight="bold">Proporção Genotípica:</tspan> 1 VV : 2 Vv : 1 vv (1 : 2 : 1)
      </text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(40, 330)">
    <rect width="720" height="100" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="20" y="22" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      PRINCÍPIO BIOLÓGICO DA 1ª LEI DE MENDEL:
    </text>
    <text x="20" y="44" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      Cada característica hereditária é determinada por um par de fatores (alelos) que se <tspan fill="#FBBF24" font-weight="bold">segregam independentemente</tspan> durante a formação dos gametas (na Anáfase I da meiose).
    </text>
    <text x="20" y="66" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      Como consequência da meiose, cada gameta (espermatozoide ou óvulo) recebe apenas <tspan fill="#34D399" font-weight="bold">um único alelo</tspan> de cada par (estado haploide n).
    </text>
  </g>
</svg>