<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <text x="400" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Sistema Sanguíneo ABO e Fator Rh: Genética e Transfusão
  </text>
  <text x="400" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Aglutinogênios nas hemácias, aglutininas no plasma e regras de compatibilidade transfusional
  </text>

  <!-- Table 4 Blood Groups: A, B, AB, O -->
  <g transform="translate(40, 65)">
    <!-- Header Row -->
    <rect width="720" height="32" rx="4" fill="#1E293B" stroke="#475569"/>
    <text x="70" y="21" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GRUPO</text>
    <text x="210" y="21" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GENÓTIPO</text>
    <text x="370" y="21" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AGLUTINOGÊNIO (Hemácia)</text>
    <text x="540" y="21" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AGLUTININA (Plasma)</text>
    <text x="670" y="21" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DOAÇÃO</text>

    <!-- Row 1: Tipo A -->
    <g transform="translate(0, 36)">
      <rect width="720" height="44" rx="4" fill="#0F172A" stroke="#334155"/>
      <circle cx="70" cy="22" r="14" fill="#DC2626"/>
      <text x="70" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">A</text>
      <text x="210" y="26" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">IᴬIᴬ ou Iᴬi</text>
      <text x="370" y="26" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Antígeno A</text>
      <text x="540" y="26" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Anti-B</text>
      <text x="670" y="26" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Doa p/ A e AB</text>
    </g>

    <!-- Row 2: Tipo B -->
    <g transform="translate(0, 84)">
      <rect width="720" height="44" rx="4" fill="#0F172A" stroke="#334155"/>
      <circle cx="70" cy="22" r="14" fill="#2563EB"/>
      <text x="70" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">B</text>
      <text x="210" y="26" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">IᴮIᴮ ou Iᴮi</text>
      <text x="370" y="26" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Antígeno B</text>
      <text x="540" y="26" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Anti-A</text>
      <text x="670" y="26" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Doa p/ B e AB</text>
    </g>

    <!-- Row 3: Tipo AB -->
    <g transform="translate(0, 132)">
      <rect width="720" height="44" rx="4" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2"/>
      <ellipse cx="70" cy="22" rx="16" ry="14" fill="#7C3AED"/>
      <text x="70" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AB</text>
      <text x="210" y="26" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">IᴬIᴮ (Codominância)</text>
      <text x="370" y="26" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Antígenos A e B</text>
      <text x="540" y="26" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">NENHUMA aglutinina</text>
      <text x="670" y="20" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">RECEPTOR</text>
      <text x="670" y="32" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">UNIVERSAL (AB+)</text>
    </g>

    <!-- Row 4: Tipo O -->
    <g transform="translate(0, 180)">
      <rect width="720" height="44" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
      <circle cx="70" cy="22" r="14" fill="#059669"/>
      <text x="70" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">O</text>
      <text x="210" y="26" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">ii (Homozigoto Recessivo)</text>
      <text x="370" y="26" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">NENHUM aglutinogênio</text>
      <text x="540" y="26" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Anti-A e Anti-B</text>
      <text x="670" y="20" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">DOADOR</text>
      <text x="670" y="32" fill="#34D399" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">UNIVERSAL (O-)</text>
    </g>
  </g>

  <!-- Bottom Box: Fator Rh & Eritroblastose Fetal -->
  <g transform="translate(40, 310)">
    <rect width="720" height="120" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="20" y="22" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      O FATOR Rh E A ERITROBLASTOSE FETAL (DOENÇA HEMOLÍTICA DO RECÉM-NASCIDO):
    </text>
    <text x="20" y="44" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      • <tspan fill="#38BDF8" font-weight="bold">Rh Positivo (RR ou Rr):</tspan> possui a proteína Antígeno D nas hemácias (dominante).
    </text>
    <text x="20" y="62" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      • <tspan fill="#34D399" font-weight="bold">Rh Negativo (rr):</tspan> ausência de antígeno D. Não possui anti-Rh natural, mas se sensibiliza se exposto ao sangue Rh+.
    </text>
    <text x="20" y="80" fill="#F87171" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">
      • Condição obrigatória para Eritroblastose: Mãe Rh⁻ com Feto Rh⁺ (geralmente a partir da 2ª gestação).
    </text>
    <text x="20" y="98" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">
      Prevenção: Injeção de soro com anticorpos Anti-Rh (imunoglobulina anti-D) na mãe logo após o 1º parto para destruir hemácias fetais antes da sensibilização.
    </text>
  </g>
</svg>