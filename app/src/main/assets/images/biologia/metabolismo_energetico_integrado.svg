<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <text x="400" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Metabolismo Energético Celular Integrado
  </text>
  <text x="400" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Glicólise, Destino Aeróbio (Ciclo de Krebs e Cadeia Respiratória) e Vias de Fermentação
  </text>

  <!-- Section 1: CITOSOL (Glicólise) -->
  <g transform="translate(30, 65)">
    <rect width="230" height="250" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="15" y="10" width="200" height="22" rx="4" fill="#0284C7" fill-opacity="0.2"/>
    <text x="25" y="25" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">CITOSOL • GLICÓLISE</text>

    <!-- Substrates and Flow -->
    <rect x="50" y="45" width="130" height="30" rx="6" fill="#0369A1" stroke="#38BDF8"/>
    <text x="115" y="64" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Glicose (6C)</text>

    <line x1="115" y1="75" x2="115" y2="115" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="175" y="98" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">+2 ATP Líquidos</text>
    <text x="175" y="110" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="9">+2 NADH</text>

    <rect x="40" y="125" width="150" height="32" rx="6" fill="#0284C7" stroke="#38BDF8"/>
    <text x="115" y="145" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2 Piruvatos (3C)</text>

    <!-- Features -->
    <text x="15" y="185" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Via 100% Anaeróbia</text>
    <text x="15" y="202" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Comum a todos os seres vivos</text>
    <text x="15" y="220" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">• Saldo: 2 ATP + 2 NADH</text>
    <text x="15" y="237" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Não consome O₂ nesta fase</text>
  </g>

  <!-- Arrow to Mitochondria (With O2) -->
  <g transform="translate(265, 140)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
    <rect x="-5" y="-22" width="45" height="18" rx="3" fill="#065F46" stroke="#10B981"/>
    <text x="17" y="-10" fill="#34D399" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">COM O₂</text>
  </g>

  <!-- Arrow down to Fermentation (Without O2) -->
  <g transform="translate(145, 320)">
    <line x1="0" y1="0" x2="0" y2="25" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="8" y="2" width="60" height="18" rx="3" fill="#7F1D1D" stroke="#EF4444"/>
    <text x="38" y="14" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">SEM O₂</text>
  </g>

  <!-- Section 2: MITOCÔNDRIA (Krebs e Cadeia) -->
  <g transform="translate(305, 65)">
    <rect width="465" height="250" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="15" y="10" width="435" height="22" rx="4" fill="#B45309" fill-opacity="0.3"/>
    <text x="25" y="25" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      MITOCÔNDRIA • VIA AERÓBIA (ALTO RENDIMENTO ENERGÉTICO)
    </text>

    <!-- Sub-block 1: Ciclo de Krebs (Matriz) -->
    <g transform="translate(20, 45)">
      <rect width="195" height="185" rx="6" fill="#0F172A" stroke="#CA8A04" stroke-width="1"/>
      <text x="97" y="20" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">CICLO DE KREBS (Matriz)</text>

      <path d="M 50 65 A 35 35 0 1 1 145 65" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="3,2"/>
      <text x="97" y="70" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Acetil-CoA</text>

      <text x="15" y="115" fill="#F87171" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">• Libera CO₂ (expiração)</text>
      <text x="15" y="132" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Produz 6 NADH + 2 FADH₂</text>
      <text x="15" y="150" fill="#34D399" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">• Produz 2 ATP (ou GTP)</text>
      <text x="15" y="168" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Oxidação total da molécula</text>
    </g>

    <!-- Connector to Cristae -->
    <line x1="225" y1="135" x2="245" y2="135" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <!-- Sub-block 2: Cristas (Cadeia e ATP-Sintase) -->
    <g transform="translate(250, 45)">
      <rect width="195" height="185" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
      <text x="97" y="20" fill="#34D399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">CADEIA RESPIRATÓRIA (Cristas)</text>

      <!-- Flow of e- and O2 -->
      <rect x="15" y="35" width="165" height="30" rx="4" fill="#065F46" stroke="#059669"/>
      <text x="97" y="54" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">O₂ = Aceptor Final de e-</text>

      <text x="15" y="90" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9.5">• Formação de Água (H₂O)</text>
      <text x="15" y="108" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Bombeamento de prótons H⁺</text>
      <text x="15" y="128" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• ATP-Sintase Quimiosmótica</text>
      <rect x="15" y="142" width="165" height="30" rx="4" fill="#064E3B" stroke="#34D399"/>
      <text x="97" y="161" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Rendimento: ~26 a 28 ATP</text>
    </g>
  </g>

  <!-- Section 3: FERMENTAÇÕES (Embaixo) -->
  <g transform="translate(30, 335)">
    <rect width="740" height="95" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="20" y="22" fill="#F87171" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      VIAS ANAERÓBIAS ALTERNATIVAS (FERMENTAÇÃO NO CITOSOL QUANDO FALTA O₂):
    </text>

    <!-- Fermentação Láctica -->
    <g transform="translate(20, 32)">
      <rect width="335" height="52" rx="4" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
      <text x="10" y="18" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">FERMENTAÇÃO LÁCTICA</text>
      <text x="10" y="32" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9">Piruvato + NADH → Lactato (Sem gás CO₂)</text>
      <text x="10" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Músculo humano em hipóxia e bactérias do iogurte</text>
    </g>

    <!-- Fermentação Alcoólica -->
    <g transform="translate(385, 32)">
      <rect width="335" height="52" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
      <text x="10" y="18" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">FERMENTAÇÃO ALCOÓLICA</text>
      <text x="10" y="32" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9">Piruvato + NADH → Etanol + CO₂ ↑ (Gás)</text>
      <text x="10" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Leveduras (Saccharomyces): pão fofo e etanol combustível</text>
    </g>
  </g>
</svg>