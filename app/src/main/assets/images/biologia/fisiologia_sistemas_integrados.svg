<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <text x="400" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Fisiologia Humana Integrada: Cooperação Entre os Grandes Sistemas
  </text>
  <text x="400" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    A circulação sanguínea como elo integrador de nutrição, hematose, metabolismo e excreção
  </text>

  <!-- Central Circulatory Hub -->
  <g transform="translate(290, 130)">
    <rect width="220" height="150" rx="14" fill="#1E1B4B" stroke="#EF4444" stroke-width="2"/>
    <rect x="15" y="12" width="190" height="24" rx="4" fill="#DC2626" fill-opacity="0.2"/>
    <text x="110" y="28" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SISTEMA CIRCULATÓRIO</text>

    <text x="110" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Coração &amp; Vasos</text>
    <text x="110" y="78" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">• Distribui Nutrientes e O₂</text>
    <text x="110" y="94" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">• Recolhe CO₂ e Ureia</text>
    <text x="110" y="110" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">• Transporte de Hormônios</text>
    <text x="110" y="132" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Pressão &amp; Débito Cardíaco</text>
  </g>

  <!-- Left: Sistema Digestório -->
  <g transform="translate(30, 80)">
    <rect width="210" height="115" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="15" y="22" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">SISTEMA DIGESTÓRIO</text>
    <text x="15" y="42" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Mastigação e digestão química</text>
    <text x="15" y="58" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Enzimas: amilase, pepsina, tripsina</text>
    <text x="15" y="74" fill="#34D399" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">• Absorção nas vilosidades</text>
    <text x="15" y="90" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Entrega glicose e aminoácidos</text>

    <!-- Arrow to heart -->
    <line x1="210" y1="58" x2="280" y2="150" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Left: Sistema Respiratório -->
  <g transform="translate(30, 220)">
    <rect width="210" height="115" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="15" y="22" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">SISTEMA RESPIRATÓRIO</text>
    <text x="15" y="42" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Ventilação pulmonar (diafragma)</text>
    <text x="15" y="58" fill="#34D399" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">• Hematose nos alvéolos (difusão)</text>
    <text x="15" y="74" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Captação de O₂ pela hemoglobina</text>
    <text x="15" y="90" fill="#F87171" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">• Eliminação de CO₂ gasoso</text>

    <!-- Arrow to heart -->
    <line x1="210" y1="58" x2="280" y2="0" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Right: Tecidos Periféricos / Células -->
  <g transform="translate(560, 80)">
    <rect width="210" height="115" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
    <text x="15" y="22" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">CÉLULAS E TECIDOS</text>
    <text x="15" y="42" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Consomem Glicose e O₂</text>
    <text x="15" y="58" fill="#34D399" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">• Respiração Celular (ATP)</text>
    <text x="15" y="74" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Geram catabólitos (CO₂ e Ureia)</text>
    <text x="15" y="90" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Mantêm a homeostase corpórea</text>

    <!-- Arrow from heart -->
    <line x1="-50" y1="150" x2="0" y2="58" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Right: Sistema Excretor Renal -->
  <g transform="translate(560, 220)">
    <rect width="210" height="115" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="15" y="22" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">SISTEMA EXCRETOR (Rins)</text>
    <text x="15" y="42" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Filtração do sangue arterial</text>
    <text x="15" y="58" fill="#34D399" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">• Eliminação de Ureia e excessos</text>
    <text x="15" y="74" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Osmorregulação e equilíbrio hídrico</text>
    <text x="15" y="90" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">• Controle do pH sanguíneo</text>

    <!-- Arrow from heart -->
    <line x1="-50" y1="0" x2="0" y2="58" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(30, 350)">
    <rect width="740" height="80" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="20" y="22" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      O CONCEITO CENTRAL DE HOMEOSTASE NO ENEM:
    </text>
    <text x="20" y="42" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      Nenhum sistema do corpo funciona isolado. Durante o exercício físico, o aumento do metabolismo celular eleva o <tspan fill="#F87171" font-weight="bold">CO₂ no sangue</tspan>, acidificando o pH.
    </text>
    <text x="20" y="60" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      O bulbo cerebral detecta a acidose e dispara o aumento simultâneo da <tspan fill="#38BDF8" font-weight="bold">frequência respiratória</tspan> (para lavar CO₂) e da <tspan fill="#EF4444" font-weight="bold">frequência cardíaca</tspan>!
    </text>
  </g>
</svg>