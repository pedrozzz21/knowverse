<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <text x="400" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    A Teoria Endossimbiótica Sequencial (Lynn Margulis, 1967)
  </text>
  <text x="400" y="50" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    A origem evolutiva bacteriana das Mitocôndrias e dos Cloroplastos
  </text>

  <!-- Step 1: Célula ancestral e bactéria aeróbia -->
  <g transform="translate(30, 75)">
    <rect width="220" height="230" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.2"/>
    <text x="110" y="24" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1. FAGOCITOSE PRIMÁRIA</text>

    <!-- Anaerobic host cell -->
    <ellipse cx="110" cy="110" rx="90" ry="60" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/>
    <ellipse cx="80" cy="110" rx="20" ry="18" fill="#312E81"/>
    <text x="80" y="113" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Núcleo</text>

    <!-- Engulfed aerobic bacterium (Mitochondria ancestor) -->
    <g transform="translate(130, 95)">
      <ellipse cx="15" cy="12" rx="14" ry="9" fill="#B45309" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="15" y="32" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Bactéria Aeróbia</text>
    </g>

    <text x="110" y="190" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Célula hospedeira anaeróbia</text>
    <text x="110" y="205" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">engloba bactéria aeróbia livre</text>
    <text x="110" y="220" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">(Sobrevive sem ser digerida)</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="255" y1="190" x2="280" y2="190" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Mutualismo e Mitocôndria -->
  <g transform="translate(290, 75)">
    <rect width="220" height="230" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="110" y="24" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2. SURGE A MITOCÔNDRIA</text>

    <ellipse cx="110" cy="110" rx="90" ry="60" fill="#1E1B4B" stroke="#F59E0B" stroke-width="1.5"/>
    <ellipse cx="70" cy="110" rx="20" ry="18" fill="#312E81"/>
    <text x="70" y="113" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Núcleo</text>

    <!-- Established mitochondria inside -->
    <ellipse cx="125" cy="90" rx="16" ry="10" fill="#B45309" stroke="#F59E0B" stroke-width="1.2"/>
    <ellipse cx="140" cy="125" rx="16" ry="10" fill="#B45309" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="140" y="145" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Mitocôndrias</text>

    <text x="110" y="190" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Simbiose obrigatória estável:</text>
    <text x="110" y="205" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Bactéria produz ATP em massa;</text>
    <text x="110" y="220" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Hospedeiro fornece proteção e piruvato</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="515" y1="190" x2="540" y2="190" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Segunda Endossimbiose (Cloroplasto) -->
  <g transform="translate(550, 75)">
    <rect width="220" height="230" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
    <text x="110" y="24" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3. SURGE O CLOROPLASTO</text>

    <ellipse cx="110" cy="110" rx="90" ry="60" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <ellipse cx="65" cy="110" rx="18" ry="16" fill="#312E81"/>

    <!-- Mitochondria + Chloroplast -->
    <ellipse cx="110" cy="85" rx="13" ry="8" fill="#B45309" stroke="#F59E0B"/>
    <ellipse cx="140" cy="105" rx="18" ry="11" fill="#15803D" stroke="#4ADE80" stroke-width="1.2"/>
    <ellipse cx="110" cy="130" rx="18" ry="11" fill="#15803D" stroke="#4ADE80" stroke-width="1.2"/>
    <text x="140" y="128" fill="#86EFAC" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Cloroplastos</text>

    <text x="110" y="190" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Linhagem vegetal engloba</text>
    <text x="110" y="205" fill="#34D399" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Cianobactéria fotossintetizante:</text>
    <text x="110" y="220" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Origem das Algas e Plantas Verdes</text>
  </g>

  <!-- Evidence Banner Box -->
  <g transform="translate(30, 315)">
    <rect width="740" height="115" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="20" y="22" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">
      O QUARTETO DE EVIDÊNCIAS MOLECULARES IRREFUTÁVEIS (EXIGIDAS NO ENEM):
    </text>
    <text x="20" y="44" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      1. <tspan fill="#FBBF24" font-weight="bold">DNA Próprio Circular e Desnudo:</tspan> Sem histonas, com sequência homóloga ao genoma de bactérias aeróbias/cianobactérias.
    </text>
    <text x="20" y="64" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      2. <tspan fill="#FBBF24" font-weight="bold">Ribossomos 70S Próprios:</tspan> Do mesmo tamanho dos ribossomos bacterianos e inibidos pelos mesmos antibióticos.
    </text>
    <text x="20" y="84" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      3. <tspan fill="#FBBF24" font-weight="bold">Dupla Membrana:</tspan> A interna é a antiga membrana da bactéria (com cardiolipina); a externa veio da vesícula hospedeira.
    </text>
    <text x="20" y="104" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      4. <tspan fill="#FBBF24" font-weight="bold">Autoduplicação Independente:</tspan> Dividem-se por fissão binária simples (bipartição), como bactérias livres.
    </text>
  </g>
</svg>