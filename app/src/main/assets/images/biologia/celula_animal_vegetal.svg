<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="animalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <text x="400" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Organelas Citoplasmáticas: Célula Animal vs. Célula Vegetal
  </text>
  <text x="400" y="50" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Comparativo estrutural, organelas exclusivas e cooperação metabólica
  </text>

  <!-- Left: Animal Cell -->
  <g transform="translate(35, 65)">
    <rect width="350" height="355" rx="10" fill="url(#animalGrad)" stroke="#6366F1" stroke-width="1.5"/>
    <rect x="15" y="12" width="130" height="24" rx="4" fill="#6366F1" fill-opacity="0.2"/>
    <text x="25" y="29" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">CÉLULA ANIMAL</text>

    <!-- Cell outline (irregular / rounded) -->
    <ellipse cx="175" cy="120" rx="140" ry="70" fill="#1E293B" stroke="#818CF8" stroke-width="1.8"/>

    <!-- Nucleus -->
    <ellipse cx="130" cy="120" rx="35" ry="30" fill="#312E81" stroke="#A5B4FC" stroke-width="1.5"/>
    <circle cx="125" cy="120" r="10" fill="#C7D2FE"/>
    <text x="130" y="124" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Núcleo</text>

    <!-- Mitochondria -->
    <ellipse cx="230" cy="95" rx="20" ry="12" fill="#B45309" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="230" y="118" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Mitocôndria</text>

    <!-- Centrioles (Exclusive to animal cells in angiosperms context) -->
    <g transform="translate(250, 130)">
      <rect x="0" y="0" width="8" height="18" rx="2" fill="#EC4899"/>
      <rect x="4" y="5" width="18" height="8" rx="2" fill="#EC4899"/>
      <text x="12" y="30" fill="#F472B6" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Centríolos</text>
    </g>

    <!-- Lysosome (evident) -->
    <circle cx="85" cy="140" r="12" fill="#DC2626" stroke="#F87171" stroke-width="1.2"/>
    <text x="85" y="162" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Lisossomo</text>

    <!-- Golgi -->
    <path d="M 180 130 Q 195 125 185 145 T 195 160" fill="none" stroke="#F43F5E" stroke-width="3"/>
    <text x="215" y="152" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="8">Golgi</text>

    <!-- Features -->
    <g transform="translate(15, 205)">
      <rect width="320" height="135" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="10" y="20" fill="#F472B6" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">ESTRUTURAS TÍPICAS / EXCLUSIVAS:</text>
      <text x="10" y="40" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">• Centríolos (formação de cílios, flagelos e fuso)</text>
      <text x="10" y="60" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">• Lisossomos evidentes (digestão intracelular)</text>
      <text x="10" y="80" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">• Colesterol intercalado na membrana plasmática</text>
      <text x="10" y="100" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">• Reserva energética de Glicogênio (fígado/músculo)</text>
      <text x="10" y="120" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Ausentes: Parede celulósica, plastos e grande vacúolo</text>
    </g>
  </g>

  <!-- Right: Plant Cell -->
  <g transform="translate(415, 65)">
    <rect width="350" height="355" rx="10" fill="url(#plantGrad)" stroke="#10B981" stroke-width="1.5"/>
    <rect x="15" y="12" width="130" height="24" rx="4" fill="#10B981" fill-opacity="0.2"/>
    <text x="25" y="29" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">CÉLULA VEGETAL</text>

    <!-- Polygonal cell wall outline -->
    <polygon points="40,90 80,60 270,60 310,90 310,165 270,190 80,190 40,165" fill="#065F46" fill-opacity="0.3" stroke="#059669" stroke-width="4"/>
    <polygon points="45,92 82,64 268,64 305,92 305,163 268,186 82,186 45,163" fill="#022C22" stroke="#34D399" stroke-width="1.5"/>

    <!-- Large Central Vacuole (Up to 90% volume) -->
    <rect x="130" y="80" width="120" height="75" rx="14" fill="#0284C7" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="190" y="122" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Vacúolo Central</text>
    <text x="190" y="135" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">(Osmorregulação &amp; Turgor)</text>

    <!-- Nucleus displaced to the periphery -->
    <ellipse cx="80" cy="115" rx="24" ry="20" fill="#312E81" stroke="#A5B4FC" stroke-width="1.2"/>
    <text x="80" y="119" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Núcleo</text>

    <!-- Chloroplast (Exclusive to photosynthetic) -->
    <ellipse cx="90" cy="155" rx="18" ry="11" fill="#15803D" stroke="#4ADE80" stroke-width="1.5"/>
    <!-- Thylakoids inside -->
    <line x1="80" y1="155" x2="100" y2="155" stroke="#BBF7D0" stroke-width="2"/>
    <text x="90" y="174" fill="#86EFAC" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Cloroplasto</text>

    <!-- Features -->
    <g transform="translate(15, 205)">
      <rect width="320" height="135" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="10" y="20" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">ESTRUTURAS EXCLUSIVAS:</text>
      <text x="10" y="40" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">• Parede Celular Celulósica (rigidez mecânica)</text>
      <text x="10" y="60" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">• Cloroplastos com clorofila (realizam fotossíntese)</text>
      <text x="10" y="80" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">• Grande Vacúolo Central de Suco Celular</text>
      <text x="10" y="100" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">• Plasmodesmos (comunicação entre células vizinhas)</text>
      <text x="10" y="120" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Reserva energética: Amido vegetal (grânulos)</text>
    </g>
  </g>
</svg>