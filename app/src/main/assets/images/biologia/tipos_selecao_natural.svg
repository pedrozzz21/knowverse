<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <text x="400" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Os Tipos de Seleção Natural (Neodarwinismo)
  </text>
  <text x="400" y="50" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Como as pressões ambientais alteram a distribuição dos fenótipos em uma população
  </text>

  <!-- 3 Columns for 3 Types of Natural Selection -->
  <!-- Col 1: Estabilizadora -->
  <g transform="translate(35, 75)">
    <rect width="225" height="255" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <rect x="15" y="12" width="195" height="22" rx="4" fill="#065F46" fill-opacity="0.3"/>
    <text x="112" y="27" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      1. ESTABILIZADORA
    </text>

    <!-- Curve: Middle phenotype narrowed/favored -->
    <g transform="translate(25, 55)">
      <!-- Base Axis -->
      <line x1="10" y1="90" x2="165" y2="90" stroke="#475569" stroke-width="1.5"/>
      <!-- Original population curve (dashed) -->
      <path d="M 20 90 Q 87 20 155 90" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,2"/>
      <!-- After selection curve (tall in center) -->
      <path d="M 40 90 Q 87 -5 135 90" fill="none" stroke="#10B981" stroke-width="2.5"/>
      <!-- Arrows pressing the extremes -->
      <line x1="30" y1="40" x2="50" y2="60" stroke="#EF4444" stroke-width="2"/>
      <line x1="145" y1="40" x2="125" y2="60" stroke="#EF4444" stroke-width="2"/>
    </g>

    <text x="112" y="165" fill="#34D399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">
      Favorece o Fenótipo MÉDIO
    </text>
    <text x="15" y="185" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Elimina os dois extremos</text>
    <text x="15" y="202" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Reduz a variabilidade fenotípica</text>
    <text x="15" y="222" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Exemplo ENEM:</text>
    <text x="15" y="238" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Peso ideal de recém-nascidos (~3 kg)</text>
  </g>

  <!-- Col 2: Direcional -->
  <g transform="translate(285, 75)">
    <rect width="225" height="255" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="15" y="12" width="195" height="22" rx="4" fill="#B45309" fill-opacity="0.3"/>
    <text x="112" y="27" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      2. DIRECIONAL
    </text>

    <!-- Curve: Shifted to one extreme -->
    <g transform="translate(25, 55)">
      <!-- Base Axis -->
      <line x1="10" y1="90" x2="165" y2="90" stroke="#475569" stroke-width="1.5"/>
      <!-- Original curve -->
      <path d="M 20 90 Q 75 25 130 90" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,2"/>
      <!-- Shifted curve to the right -->
      <path d="M 65 90 Q 120 15 165 90" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
      <!-- Push arrow to the right -->
      <line x1="35" y1="50" x2="65" y2="50" stroke="#F59E0B" stroke-width="2.5"/>
    </g>

    <text x="112" y="165" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">
      Favorece UM ÚNICO Extremo
    </text>
    <text x="15" y="185" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Desloca a curva da média</text>
    <text x="15" y="202" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Resposta a mudanças ambientais</text>
    <text x="15" y="222" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Exemplo ENEM:</text>
    <text x="15" y="238" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Superbactérias resistentes a fármacos</text>
  </g>

  <!-- Col 3: Disruptiva -->
  <g transform="translate(535, 75)">
    <rect width="225" height="255" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="15" y="12" width="195" height="22" rx="4" fill="#7F1D1D" fill-opacity="0.3"/>
    <text x="112" y="27" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      3. DISRUPTIVA (Diversificadora)
    </text>

    <!-- Curve: Two peaks at extremes, valley in center -->
    <g transform="translate(25, 55)">
      <!-- Base Axis -->
      <line x1="10" y1="90" x2="165" y2="90" stroke="#475569" stroke-width="1.5"/>
      <!-- Original curve -->
      <path d="M 20 90 Q 87 20 155 90" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,2"/>
      <!-- Bimodal curve -->
      <path d="M 20 90 Q 50 15 80 65 Q 115 15 150 90" fill="none" stroke="#EF4444" stroke-width="2.5"/>
      <!-- Arrow pushing down the middle -->
      <line x1="87" y1="20" x2="87" y2="45" stroke="#EF4444" stroke-width="2.5"/>
    </g>

    <text x="112" y="165" fill="#F87171" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">
      Favorece os DOIS Extremos
    </text>
    <text x="15" y="185" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Elimina o fenótipo intermediário</text>
    <text x="15" y="202" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• Pode levar à especiação biológica</text>
    <text x="15" y="222" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Exemplo ENEM:</text>
    <text x="15" y="238" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Tentilhões com bicos finos OU grossos</text>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(35, 345)">
    <rect width="725" height="85" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="20" y="22" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      IMPORTANTE: A SELEÇÃO NATURAL CRIA NOVAS CARACTERÍSTICAS?
    </text>
    <text x="20" y="44" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      <tspan fill="#F87171" font-weight="bold">NÃO!</tspan> A Seleção Natural atua como um <tspan fill="#38BDF8" font-weight="bold">filtro seletivo passivo</tspan> sobre a variabilidade genética pré-existente gerada por <tspan fill="#FBBF24">mutações aleatórias</tspan> e <tspan fill="#FBBF24">recombinação gênica</tspan> (crossing-over).
    </text>
    <text x="20" y="66" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">
      O ambiente não "induz" mutações adaptativas (erro lamarckista clássico), mas seleciona os indivíduos mais aptos que já portavam a mutação!
    </text>
  </g>
</svg>