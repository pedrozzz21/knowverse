<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="560" fill="url(#bg)" rx="16"/>

  <!-- Title & Header -->
  <text x="475" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC" text-anchor="middle">
    Biotecnologia: Tecnologia do DNA Recombinante e PCR
  </text>
  <text x="475" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">
    Construção de Plasmídeos Transgênicos, Amplificação Térmica e Separação por Eletroforese
  </text>

  <!-- LEFT: Fluxo do DNA Recombinante -->
  <g transform="translate(30, 90)">
    <rect width="460" height="435" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
    
    <rect x="20" y="16" width="230" height="26" rx="13" fill="#065F46" opacity="0.4"/>
    <text x="135" y="34" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34D399" text-anchor="middle">
      DNA RECOMBINANTE (TRANSGENIA)
    </text>

    <!-- Step 1: Gene de Interesse -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="180" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">Gene Humano (cDNA)</text>
      <text x="12" y="38" font-family="sans-serif" font-size="10" fill="#94A3B8">Ex: Gene da Insulina</text>
      <rect x="12" y="46" width="156" height="6" rx="3" fill="#0284C7"/>

      <!-- Plasmídeo -->
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="195" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FBBF24">Plasmídeo Bacteriano</text>
        <text x="12" y="38" font-family="sans-serif" font-size="10" fill="#94A3B8">Vetor circular de clonagem</text>
        <circle cx="160" cy="30" r="14" fill="none" stroke="#F59E0B" stroke-width="4"/>
      </g>
    </g>

    <!-- Arrow down with Restriction Enzyme -->
    <path d="M 230 135 L 230 165" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="130" y="140" width="200" height="22" rx="11" fill="#4C1D95" opacity="0.6"/>
    <text x="230" y="155" font-family="sans-serif" font-size="10" font-weight="bold" fill="#C084FC" text-anchor="middle">
      Corte com Enzima de Restrição
    </text>

    <!-- Step 2: Sticky Ends -->
    <g transform="translate(25, 175)">
      <rect x="0" y="0" width="410" height="65" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="15" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F8FAFC">Geração de Extremidades Coesivas (Sticky Ends)</text>
      <text x="15" y="38" font-family="sans-serif" font-size="10" fill="#94A3B8">Sítio palindrômico reconhecido e cortado em degrau (ex: EcoRI).</text>
      <text x="15" y="54" font-family="sans-serif" font-size="10" fill="#34D399">Ambos os fragmentos possuem bases complementares desemparelhadas.</text>
    </g>

    <!-- Arrow down with DNA Ligase -->
    <rect x="130" y="250" width="200" height="22" rx="11" fill="#065F46" opacity="0.6"/>
    <text x="230" y="265" font-family="sans-serif" font-size="10" font-weight="bold" fill="#34D399" text-anchor="middle">
      União catalisada por DNA Ligase
    </text>

    <!-- Step 3: Recombinant Plasmid & Transformation -->
    <g transform="translate(25, 285)">
      <rect x="0" y="0" width="410" height="130" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
      <text x="15" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34D399">Plasmídeo Recombinante & Transformação Bacteriana</text>
      
      <!-- Plasmid ring with insert -->
      <circle cx="65" cy="75" r="28" fill="none" stroke="#F59E0B" stroke-width="6"/>
      <path d="M 85 55 A 28 28 0 0 1 93 75" fill="none" stroke="#38BDF8" stroke-width="8"/>
      
      <g transform="translate(120, 45)">
        <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#F8FAFC">• Inserção do plasmídeo na bactéria hospedeira (E. coli).</text>
        <text x="0" y="35" font-family="sans-serif" font-size="11" fill="#F8FAFC">• Expressão do gene humano pelo maquinário bacteriano.</text>
        <text x="0" y="55" font-family="sans-serif" font-size="11" fill="#FBBF24">• Código Genético Universal torna a tradução idêntica!</text>
        <text x="0" y="75" font-family="sans-serif" font-size="10" fill="#94A3B8">Produção industrial de insulina humana pura e segura.</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: PCR e Eletroforese -->
  <g transform="translate(515, 90)">
    <rect width="405" height="435" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow)"/>
    
    <rect x="20" y="16" width="220" height="26" rx="13" fill="#0369A1" opacity="0.4"/>
    <text x="130" y="34" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">
      PCR E ELETROFORESE EM GEL
    </text>

    <!-- PCR Cycle -->
    <g transform="translate(20, 55)">
      <text x="5" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">
        Ciclo Térmico da PCR (Taq Polimerase)
      </text>

      <rect x="0" y="25" width="115" height="75" rx="8" fill="#1E293B" stroke="#F43F5E" stroke-width="1"/>
      <text x="57" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FB7185" text-anchor="middle">1. Desnaturação</text>
      <text x="57" y="65" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC" text-anchor="middle">~95°C</text>
      <text x="57" y="85" font-family="sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Separação de fitas</text>

      <rect x="125" y="25" width="115" height="75" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
      <text x="182" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38BDF8" text-anchor="middle">2. Anelamento</text>
      <text x="182" y="65" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC" text-anchor="middle">~55°C</text>
      <text x="182" y="85" font-family="sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Ligação de Primers</text>

      <rect x="250" y="25" width="115" height="75" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
      <text x="307" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34D399" text-anchor="middle">3. Extensão</text>
      <text x="307" y="65" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC" text-anchor="middle">~72°C</text>
      <text x="307" y="85" font-family="sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Taq Polimerase</text>

      <text x="5" y="120" font-family="sans-serif" font-size="11" fill="#FBBF24">
        Amplificação Exponencial: Cópias = N₀ × 2ⁿ (após n ciclos)
      </text>
    </g>

    <!-- Gel Electrophoresis -->
    <g transform="translate(20, 205)">
      <text x="5" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">
        Eletroforese: Separação por Tamanho Molecular
      </text>

      <!-- Gel slab -->
      <rect x="0" y="25" width="365" height="185" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>

      <!-- Poles -->
      <rect x="10" y="32" width="70" height="18" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
      <text x="45" y="45" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94A3B8" text-anchor="middle">Cátodo (-)</text>

      <rect x="285" y="32" width="70" height="18" rx="4" fill="#881337" stroke="#F43F5E" stroke-width="1"/>
      <text x="320" y="45" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FB7185" text-anchor="middle">Ânodo (+)</text>

      <!-- Direction Arrow -->
      <path d="M 90 41 L 275 41" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="180" y="37" font-family="sans-serif" font-size="9" fill="#38BDF8" text-anchor="middle">Sentido de Migração (DNA é negativo)</text>

      <!-- Wells & Bands -->
      <!-- Lane 1: Marcador -->
      <g transform="translate(35, 65)">
        <rect x="0" y="0" width="16" height="6" fill="#334155"/>
        <line x1="20" y1="3" x2="310" y2="3" stroke="#1E293B" stroke-width="1"/>
        <rect x="30" y="0" width="6" height="6" fill="#E2E8F0" rx="1"/>
        <rect x="80" y="0" width="6" height="6" fill="#E2E8F0" rx="1"/>
        <rect x="150" y="0" width="6" height="6" fill="#E2E8F0" rx="1"/>
        <rect x="230" y="0" width="6" height="6" fill="#E2E8F0" rx="1"/>
        <text x="-25" y="5" font-family="sans-serif" font-size="9" fill="#94A3B8">Padrão</text>
      </g>

      <!-- Lane 2: Filho -->
      <g transform="translate(35, 95)">
        <rect x="0" y="0" width="16" height="6" fill="#334155"/>
        <line x1="20" y1="3" x2="310" y2="3" stroke="#1E293B" stroke-width="1"/>
        <rect x="80" y="0" width="6" height="6" fill="#38BDF8" rx="1"/>
        <rect x="230" y="0" width="6" height="6" fill="#38BDF8" rx="1"/>
        <text x="-25" y="5" font-family="sans-serif" font-size="9" fill="#38BDF8">Filho</text>
      </g>

      <!-- Lane 3: Mãe -->
      <g transform="translate(35, 125)">
        <rect x="0" y="0" width="16" height="6" fill="#334155"/>
        <line x1="20" y1="3" x2="310" y2="3" stroke="#1E293B" stroke-width="1"/>
        <rect x="80" y="0" width="6" height="6" fill="#A855F7" rx="1"/>
        <text x="-25" y="5" font-family="sans-serif" font-size="9" fill="#A855F7">Mãe</text>
      </g>

      <!-- Lane 4: Pai Compatível -->
      <g transform="translate(35, 155)">
        <rect x="0" y="0" width="16" height="6" fill="#334155"/>
        <line x1="20" y1="3" x2="310" y2="3" stroke="#1E293B" stroke-width="1"/>
        <rect x="230" y="0" width="6" height="6" fill="#10B981" rx="1"/>
        <text x="-25" y="5" font-family="sans-serif" font-size="9" fill="#10B981">Pai</text>
      </g>

      <text x="20" y="195" font-family="sans-serif" font-size="10" fill="#CBD5E1">
        • Fragmentos <tspan fill="#34D399" font-weight="bold">menores correm mais longe</tspan> (menos atrito no gel).
      </text>
    </g>
  </g>
</svg>
