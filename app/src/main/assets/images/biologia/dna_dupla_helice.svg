<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <text x="400" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Estrutura dos Ácidos Nucleicos e o Dogma Central da Biologia Molecular
  </text>
  <text x="400" y="50" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Nucleotídeos, pareamento de bases nitrogenadas (Chargaff) e fluxo de informação genética
  </text>

  <!-- Left: Nucleotide anatomy -->
  <g transform="translate(40, 70)">
    <rect width="320" height="235" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
    <text x="160" y="24" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      1. ANATOMIA DO NUCLEOTÍDEO
    </text>

    <!-- Phosphate (Yellow Circle) -->
    <circle cx="60" cy="80" r="22" fill="#EAB308" stroke="#CA8A04" stroke-width="1.5"/>
    <text x="60" y="84" fill="#000000" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">PO₄³⁻</text>
    <text x="60" y="118" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Grupo Fosfato</text>

    <!-- Pentose sugar (Pentagon) -->
    <polygon points="160,65 190,80 180,110 140,110 130,80" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="160" y="93" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Pentose</text>
    <text x="160" y="125" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Desoxirribose (DNA)</text>
    <text x="160" y="136" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Ribose (RNA)</text>

    <!-- Nitrogenous Base (Rectangle) -->
    <rect x="230" y="70" width="70" height="40" rx="4" fill="#10B981" stroke="#34D399" stroke-width="1.5"/>
    <text x="265" y="94" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Base</text>
    <text x="265" y="125" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">A, T, C, G (DNA)</text>
    <text x="265" y="136" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Uracila no RNA</text>

    <!-- Bonds connecting them -->
    <line x1="82" y1="80" x2="130" y2="80" stroke="#FBBF24" stroke-width="2"/>
    <line x1="190" y1="85" x2="230" y2="85" stroke="#38BDF8" stroke-width="2"/>

    <!-- Complementarity rule at bottom of box -->
    <g transform="translate(15, 155)">
      <rect width="290" height="65" rx="4" fill="#0F172A" stroke="#334155"/>
      <text x="10" y="18" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Regra de Chargaff (DNA):</text>
      <text x="10" y="36" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">
        • <tspan fill="#34D399" font-weight="bold">Adenina = Timina</tspan> (2 pontes de H: A = T)
      </text>
      <text x="10" y="52" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">
        • <tspan fill="#38BDF8" font-weight="bold">Citosina ≡ Guanina</tspan> (3 pontes de H: C ≡ G)
      </text>
    </g>
  </g>

  <!-- Right: Dogma Central da Biologia Molecular -->
  <g transform="translate(390, 70)">
    <rect width="370" height="235" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="185" y="24" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      2. O DOGMA CENTRAL (FLUXO GENÉTICO)
    </text>

    <!-- DNA Box -->
    <g transform="translate(25, 45)">
      <rect width="85" height="40" rx="6" fill="#312E81" stroke="#818CF8" stroke-width="1.5"/>
      <text x="42" y="25" fill="#E0E7FF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">DNA</text>
      <path d="M 42 10 A 15 15 0 1 1 20 0" fill="none" stroke="#818CF8" stroke-width="1.8"/>
      <text x="42" y="-5" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Replicação</text>
    </g>

    <!-- Arrow 1: Transcrição -->
    <g transform="translate(115, 65)">
      <line x1="5" y1="0" x2="35" y2="0" stroke="#F59E0B" stroke-width="2"/>
      <text x="20" y="-8" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Transcrição</text>
      <text x="20" y="15" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">(Núcleo)</text>
    </g>

    <!-- RNAm Box -->
    <g transform="translate(155, 45)">
      <rect width="85" height="40" rx="6" fill="#065F46" stroke="#34D399" stroke-width="1.5"/>
      <text x="42" y="25" fill="#BBF7D0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RNAm</text>
    </g>

    <!-- Arrow 2: Tradução -->
    <g transform="translate(245, 65)">
      <line x1="5" y1="0" x2="35" y2="0" stroke="#10B981" stroke-width="2"/>
      <text x="20" y="-8" fill="#34D399" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Tradução</text>
      <text x="20" y="15" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">(Ribossomo)</text>
    </g>

    <!-- Protein Box -->
    <g transform="translate(285, 45)">
      <rect width="70" height="40" rx="6" fill="#831843" stroke="#F43F5E" stroke-width="1.5"/>
      <text x="35" y="25" fill="#FCE7F3" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PROTEÍNA</text>
    </g>

    <!-- Genetic Code explanation -->
    <g transform="translate(20, 115)">
      <rect width="330" height="105" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="12" y="20" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Código Genético Universal e Degenerado:</text>
      <text x="12" y="38" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• <tspan fill="#FBBF24">Trinca de bases (Códon):</tspan> cada 3 bases codifica 1 aminoácido.</text>
      <text x="12" y="56" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• <tspan fill="#34D399">Degenerado / Redundante:</tspan> múltiplos códons codificam o mesmo aminoácido.</text>
      <text x="12" y="74" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• <tspan fill="#F43F5E">Códon de Início (AUG):</tspan> Metionina (dispara a tradução).</text>
      <text x="12" y="92" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5">• <tspan fill="#A5B4FC">Universalidade:</tspan> base da Biotecnologia e dos Transgênicos!</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(40, 320)">
    <rect width="720" height="110" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="20" y="22" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      DIFERENÇAS CRÍTICAS ENTRE DNA E RNA PARA O ENEM:
    </text>
    <text x="20" y="44" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      1. <tspan fill="#818CF8" font-weight="bold">Açúcar:</tspan> Desoxirribose no DNA (com H no C2') vs. Ribose no RNA (com OH no C2').
    </text>
    <text x="20" y="66" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      2. <tspan fill="#34D399" font-weight="bold">Base Pirimídica Exclusiva:</tspan> O DNA possui <tspan fill="#FBBF24">Timina (T)</tspan>, enquanto o RNA possui <tspan fill="#F43F5E">Uracila (U)</tspan>.
    </text>
    <text x="20" y="88" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      3. <tspan fill="#38BDF8" font-weight="bold">Conformação:</tspan> DNA é fita dupla helicoidal antiparalela (5'→3' e 3'→5'); RNA é fita simples.
    </text>
  </g>
</svg>