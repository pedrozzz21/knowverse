<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <text x="400" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    O Ciclo Menstrual e as Oscilações Hormonais
  </text>
  <text x="400" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Eixo Hipófise-Ovário: FSH, LH, Estrogênio, Progesterona e a Ovulação no 14º dia
  </text>

  <!-- Cycle Graphic Area -->
  <g transform="translate(50, 65)">
    <rect width="700" height="260" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>

    <!-- Timeline Axis 0 to 28 days -->
    <line x1="60" y1="210" x2="660" y2="210" stroke="#64748B" stroke-width="1.5"/>
    <text x="60" y="228" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Dia 1</text>
    <text x="210" y="228" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Dia 7</text>
    <text x="360" y="228" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Dia 14 (Ovulação)</text>
    <text x="510" y="228" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Dia 21</text>
    <text x="660" y="228" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Dia 28</text>

    <!-- Ovulation marker vertical dashed line -->
    <line x1="360" y1="20" x2="360" y2="210" stroke="#F43F5E" stroke-width="1.8" stroke-dasharray="4,3"/>

    <!-- Phase labels -->
    <!-- Menstruação (1-5) -->
    <rect x="60" y="25" width="90" height="20" rx="3" fill="#EF4444" fill-opacity="0.2"/>
    <text x="105" y="39" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Menstruação</text>

    <!-- Folicular (1-14) -->
    <rect x="160" y="25" width="190" height="20" rx="3" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="255" y="39" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Fase Folicular (Cresce Folículo)</text>

    <!-- Lútea (14-28) -->
    <rect x="370" y="25" width="280" height="20" rx="3" fill="#EAB308" fill-opacity="0.2"/>
    <text x="510" y="39" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Fase Lútea (Corpo Lúteo Ativo)</text>

    <!-- Curves of 4 Hormones -->
    <!-- 1. LH (Luteinizante - Rose / Big Peak at Day 14) -->
    <path d="M 60 170 Q 250 165 330 150 Q 360 40 375 160 Q 450 180 660 185" fill="none" stroke="#F43F5E" stroke-width="2.8"/>
    <text x="385" y="55" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Pico de LH (Gatilho da Ovulação!)</text>

    <!-- 2. FSH (Folículo Estimulante - Sky Blue) -->
    <path d="M 60 140 Q 150 130 250 150 Q 360 110 390 170 Q 500 180 660 180" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <text x="170" y="125" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">FSH (Estimula Folículo)</text>

    <!-- 3. Estrogênio (Green) -->
    <path d="M 60 185 Q 220 180 320 80 Q 360 160 500 110 Q 600 170 660 195" fill="none" stroke="#10B981" stroke-width="2.2"/>
    <text x="270" y="75" fill="#34D399" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Estrogênio</text>

    <!-- 4. Progesterona (Yellow / Peak in Luteal Phase) -->
    <path d="M 60 195 L 350 195 Q 510 65 640 195" fill="none" stroke="#FBBF24" stroke-width="2.8"/>
    <text x="510" y="80" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Progesterona (Mantém o Endométrio)</text>

    <!-- Legend -->
    <g transform="translate(70, 240)">
      <line x1="0" y1="5" x2="20" y2="5" stroke="#F43F5E" stroke-width="3"/>
      <text x="25" y="8" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="9">LH</text>

      <line x1="70" y1="5" x2="90" y2="5" stroke="#38BDF8" stroke-width="3"/>
      <text x="95" y="8" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="9">FSH</text>

      <line x1="140" y1="5" x2="160" y2="5" stroke="#10B981" stroke-width="3"/>
      <text x="165" y="8" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="9">Estrogênio</text>

      <line x1="240" y1="5" x2="260" y2="5" stroke="#FBBF24" stroke-width="3"/>
      <text x="265" y="8" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="9">Progesterona</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(50, 335)">
    <rect width="700" height="95" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="20" y="22" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      COMO FUNCIONA A PÍLULA ANTICONCEPCIONAL COMBINADA:
    </text>
    <text x="20" y="44" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      A pílula fornece doses diárias constantes de <tspan fill="#34D399">Estrogênio</tspan> e <tspan fill="#FBBF24">Progestina</tspan>.
    </text>
    <text x="20" y="64" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      Por <tspan fill="#38BDF8" font-weight="bold">feedback negativo (retroalimentação negativa)</tspan>, os altos níveis inibem a hipófise de liberar <tspan fill="#38BDF8">FSH</tspan> e <tspan fill="#F43F5E">LH</tspan>.
    </text>
    <text x="20" y="84" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">
      Sem o pico de LH, o folículo ovariano não se rompe: NÃO HÁ OVULAÇÃO!
    </text>
  </g>
</svg>