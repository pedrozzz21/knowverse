<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <text x="400" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Ultraestrutura do Néfron e Fisiologia Renal
  </text>
  <text x="400" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Filtração glomerular, reabsorção tubular de água e solutos e regulação pelo hormônio ADH
  </text>

  <!-- Left: Nephron Scheme -->
  <g transform="translate(40, 70)">
    <rect width="450" height="260" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>

    <!-- Glomerulus & Bowman's Capsule -->
    <g transform="translate(40, 40)">
      <!-- Bowman's capsule cup -->
      <path d="M 25 20 C 10 20 0 35 0 50 C 0 65 10 80 25 80" fill="none" stroke="#F59E0B" stroke-width="3"/>
      <!-- Glomerulus knot inside -->
      <ellipse cx="20" cy="50" rx="14" ry="14" fill="#DC2626" stroke="#EF4444" stroke-width="2"/>
      <text x="20" y="98" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Glomérulo</text>
      <text x="20" y="108" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">(Filtração)</text>
    </g>

    <!-- Proximal Convoluted Tubule (TCP) -->
    <path d="M 65 65 Q 90 40 115 65 Q 140 90 165 65" fill="none" stroke="#FBBF24" stroke-width="5"/>
    <text x="115" y="35" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Túbulo Proximal</text>
    <text x="115" y="46" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">(100% Glicose reabsorvida)</text>

    <!-- Loop of Henle (Alça néfrica / Henle) -->
    <path d="M 165 65 L 165 170 Q 185 200 205 170 L 205 65" fill="none" stroke="#38BDF8" stroke-width="4.5"/>
    <!-- Descending limb: H2O leaves -->
    <text x="140" y="125" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" text-anchor="end">H₂O sai</text>
    <!-- Ascending limb: NaCl active transport -->
    <text x="230" y="125" fill="#34D399" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">NaCl sai</text>
    <text x="185" y="215" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Alça de Henle</text>

    <!-- Distal Convoluted Tubule (TCD) -->
    <path d="M 205 65 Q 230 40 255 65 Q 280 90 305 65" fill="none" stroke="#A855F7" stroke-width="4.5"/>
    <text x="255" y="35" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Túbulo Distal</text>

    <!-- Collecting Duct (Duto Coletor com ADH) -->
    <path d="M 305 65 L 340 65 L 340 230" fill="none" stroke="#10B981" stroke-width="6"/>
    <text x="385" y="120" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Duto Coletor</text>
    <rect x="360" y="130" width="80" height="26" rx="4" fill="#064E3B" stroke="#10B981"/>
    <text x="400" y="147" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Ação do ADH</text>

    <!-- Urine exit -->
    <text x="340" y="248" fill="#FDE047" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Urina Concentrada</text>
  </g>

  <!-- Right: Hormonal Control (ADH & Aldosterona) -->
  <g transform="translate(510, 70)">
    <rect width="250" height="260" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <rect x="15" y="12" width="220" height="22" rx="4" fill="#065F46" fill-opacity="0.3"/>
    <text x="125" y="27" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      REGULAÇÃO POR ADH (ENEM)
    </text>

    <!-- Cascade explanation -->
    <g transform="translate(15, 45)">
      <text x="0" y="15" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">1. Aumento da Osmolalidade:</text>
      <text x="0" y="28" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9">(Desidratação ou excesso de sal)</text>

      <text x="0" y="50" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">2. Hipotálamo / Neuro-hipófise:</text>
      <text x="0" y="63" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9">Libera o hormônio <tspan fill="#34D399" font-weight="bold">ADH (Antidiurético)</tspan></text>

      <text x="0" y="85" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">3. Abertura de Aquaporinas:</text>
      <text x="0" y="98" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9">No túbulo distal e duto coletor renal</text>

      <text x="0" y="120" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">4. Reabsorção Maciça de Água:</text>
      <text x="0" y="133" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9">• Retém água no sangue (hidratação)</text>
      <text x="0" y="148" fill="#F87171" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">• Urina escassa e concentrada</text>
    </g>

    <!-- Alcohol inhibition box -->
    <g transform="translate(10, 200)">
      <rect width="230" height="48" rx="4" fill="#0F172A" stroke="#EF4444"/>
      <text x="10" y="18" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Álcool inibe secreção de ADH:</text>
      <text x="10" y="34" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="8.5">Sem ADH → Diurese excessiva e desidratação (ressaca).</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(40, 345)">
    <rect width="720" height="85" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="20" y="22" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      O QUE NÃO PODE APARECER NA URINA DE UMA PESSOA SAUDÁVEL:
    </text>
    <text x="20" y="44" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      1. <tspan fill="#F87171" font-weight="bold">Proteínas plasmáticas (Albumina):</tspan> são grandes demais para passar pelos poros do glomérulo (indicador de lesão renal).
    </text>
    <text x="20" y="66" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      2. <tspan fill="#FBBF24" font-weight="bold">Glicose:</tspan> é 100% reabsorvida ativamente no túbulo proximal (glicosúria indica saturação na diabetes mellitus).
    </text>
  </g>
</svg>