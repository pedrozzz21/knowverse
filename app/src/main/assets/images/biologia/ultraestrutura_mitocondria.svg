<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="mitoBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <text x="400" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Ultraestrutura da Mitocôndria e Compartimentos Respiratórios
  </text>
  <text x="400" y="50" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Localização anatômica das etapas da respiração celular aeróbia
  </text>

  <!-- Big Mitochondrion cutaway in center -->
  <g transform="translate(180, 80)">
    <!-- Outer membrane (smooth) -->
    <ellipse cx="220" cy="120" rx="210" ry="110" fill="#EA580C" stroke="#F97316" stroke-width="3"/>
    <!-- Intermembrane space -->
    <ellipse cx="220" cy="120" rx="198" ry="100" fill="#451A03" stroke="#FDBA74" stroke-width="1.5"/>
    <!-- Inner membrane with Cristae (deep folds) -->
    <path d="M 60 120 
             Q 100 80 140 100 Q 150 50 170 50 Q 190 50 180 100
             Q 220 40 240 40 Q 260 40 250 100
             Q 290 50 310 50 Q 330 50 320 100
             Q 360 80 380 120
             Q 350 160 320 140 Q 330 190 310 190 Q 290 190 280 140
             Q 250 200 230 200 Q 210 200 220 140
             Q 180 190 160 190 Q 140 190 150 140
             Q 100 160 60 120 Z"
          fill="url(#mitoBody)" stroke="#FBBF24" stroke-width="2.5"/>

    <!-- Matrix Details: Circular DNA loops -->
    <ellipse cx="200" cy="120" rx="15" ry="8" fill="none" stroke="#67E8F9" stroke-width="2" stroke-dasharray="2,2"/>
    <ellipse cx="270" cy="125" rx="12" ry="7" fill="none" stroke="#67E8F9" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="235" y="125" fill="#A5F3FC" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">DNAmt</text>

    <!-- Ribosomes 70S -->
    <circle cx="170" cy="115" r="3" fill="#FDE68A"/>
    <circle cx="185" cy="135" r="3" fill="#FDE68A"/>
    <circle cx="280" cy="105" r="3" fill="#FDE68A"/>
    <circle cx="300" cy="130" r="3" fill="#FDE68A"/>

    <!-- ATP Synthase particles on cristae -->
    <circle cx="175" cy="53" r="3" fill="#34D399"/>
    <circle cx="245" cy="43" r="3" fill="#34D399"/>
    <circle cx="315" cy="53" r="3" fill="#34D399"/>
    <circle cx="225" cy="197" r="3" fill="#34D399"/>
  </g>

  <!-- Labels on left and right -->
  <!-- Left Labels -->
  <g transform="translate(30, 95)">
    <rect width="180" height="45" rx="6" fill="#1E293B" stroke="#F97316"/>
    <text x="10" y="18" fill="#FDBA74" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">MEMBRANA EXTERNA</text>
    <text x="10" y="32" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9">• Lisa e permeável a íons</text>
    <text x="10" y="42" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">• Rica em porinas</text>
    <line x1="180" y1="22" x2="230" y2="40" stroke="#F97316" stroke-width="1.5"/>
  </g>

  <g transform="translate(30, 160)">
    <rect width="180" height="52" rx="6" fill="#1E293B" stroke="#FBBF24"/>
    <text x="10" y="18" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">CRISTAS MITOCONDRIAIS</text>
    <text x="10" y="32" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9">• Cadeia Respiratória (e-)</text>
    <text x="10" y="45" fill="#34D399" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">• Fosforilação Oxidativa (ATP)</text>
    <line x1="180" y1="26" x2="260" y2="26" stroke="#FBBF24" stroke-width="1.5"/>
  </g>

  <!-- Right Labels -->
  <g transform="translate(590, 95)">
    <rect width="180" height="48" rx="6" fill="#1E293B" stroke="#38BDF8"/>
    <text x="10" y="18" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">ESPAÇO INTERMEMBRANAS</text>
    <text x="10" y="32" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9">• Acúmulo de prótons H+</text>
    <text x="10" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">• Gera o gradiente eletroquímico</text>
    <line x1="0" y1="24" x2="-45" y2="40" stroke="#38BDF8" stroke-width="1.5"/>
  </g>

  <g transform="translate(590, 160)">
    <rect width="180" height="65" rx="6" fill="#1E293B" stroke="#A855F7"/>
    <text x="10" y="18" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">MATRIZ MITOCONDRIAL</text>
    <text x="10" y="32" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">• Ciclo de Krebs (libera CO₂)</text>
    <text x="10" y="45" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9">• Beta-oxidação de lipídios</text>
    <text x="10" y="58" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="8.5">• DNAmt circular &amp; Ribossomos 70S</text>
    <line x1="0" y1="32" x2="-80" y2="32" stroke="#A855F7" stroke-width="1.5"/>
  </g>

  <!-- Bottom Synthesis Box -->
  <g transform="translate(30, 325)">
    <rect width="740" height="105" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="20" y="22" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      RESUMO DO FLUXO RESPIRATÓRIO NA MITOCÔNDRIA:
    </text>
    <text x="20" y="44" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      1. O piruvato entra na <tspan fill="#D8B4FE" font-weight="bold">Matriz Mitocondrial</tspan> e é oxidado no Ciclo de Krebs, gerando <tspan fill="#FBBF24">NADH</tspan>, <tspan fill="#FBBF24">FADH₂</tspan> e liberando o <tspan fill="#F87171">CO₂</tspan> da expiração.
    </text>
    <text x="20" y="66" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      2. Os elétrons percorrem os citocromos nas <tspan fill="#FDE68A" font-weight="bold">Cristas</tspan>, bombeando prótons H⁺ para o <tspan fill="#7DD3FC" font-weight="bold">Espaço Intermembranas</tspan>.
    </text>
    <text x="20" y="88" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">
      3. O retorno dos H⁺ pela <tspan fill="#34D399" font-weight="bold">ATP-Sintase</tspan> produz cerca de 30-32 ATPs, enquanto o <tspan fill="#38BDF8" font-weight="bold">O₂</tspan> atua como aceptor final formando água!
    </text>
  </g>
</svg>